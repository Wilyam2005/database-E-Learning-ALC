<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Deteksi Identitas ALC</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --accent: #ff0844;
            --bg-dark: #0f172a;
            --card-glass: rgba(255, 255, 255, 0.05);
            --text-glow: 0 0 10px rgba(0, 242, 254, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto; 
            padding: 40px 20px;
            position: relative;
        }

        .bg-animation {
            position: fixed; 
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, var(--secondary) 0%, transparent 70%);
            opacity: 0.3;
            animation: float 15s infinite ease-in-out alternate;
        }

        .circle:nth-child(1) { width: 400px; height: 400px; top: -10%; left: -10%; animation-delay: 0s; }
        .circle:nth-child(2) { width: 500px; height: 500px; bottom: -20%; right: -10%; background: radial-gradient(circle, #3b82f6 0%, transparent 70%); animation-delay: -5s; animation-duration: 20s;}
        .circle:nth-child(3) { width: 300px; height: 300px; top: 40%; left: 60%; background: radial-gradient(circle, var(--primary) 0%, transparent 70%); animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 30px) scale(1.2); }
            100% { transform: translate(-30px, 50px) scale(0.9); }
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: 
                radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
                radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
            animation: particleMove 20s linear infinite;
        }

        @keyframes particleMove {
            0% { background-position: 0 0, 25px 25px; }
            100% { background-position: 50px 50px, 75px 75px; }
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                inset 0 0 20px rgba(255, 255, 255, 0.05);
            text-align: center;
            transform: translateY(30px);
            opacity: 0;
            animation: slideUpIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            z-index: 10;
            margin: auto; 
        }

        @keyframes slideUpIn {
            to { transform: translateY(0); opacity: 1; }
        }

        .cyber-badge {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid var(--primary);
            border-radius: 50px;
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            animation: pulseBadge 2s infinite;
        }

        @keyframes pulseBadge {
            0% { box-shadow: 0 0 10px rgba(0, 242, 254, 0.2); }
            50% { box-shadow: 0 0 20px rgba(0, 242, 254, 0.6); }
            100% { box-shadow: 0 0 10px rgba(0, 242, 254, 0.2); }
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: var(--text-glow);
        }

        p.subtitle {
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .input-group {
            position: relative;
            margin-bottom: 30px;
            z-index: 20;
        }

        .input-group input {
            width: 100%;
            padding: 20px 70px 20px 30px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 
                inset 0 2px 10px rgba(0,0,0,0.5),
                0 0 25px rgba(0, 242, 254, 0.4);
            transform: scale(1.02);
        }

        .input-group input::placeholder {
            color: #94a3b8;
            transition: opacity 0.3s;
        }
        
        .input-group input:focus::placeholder {
            opacity: 0.5;
        }

        .search-btn {
            position: absolute;
            right: 8px;
            top: 8px;
            bottom: 8px;
            width: 55px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #0f172a;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .search-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: all 0.5s;
        }

        .search-btn:hover {
            transform: rotate(90deg) scale(1.1);
            box-shadow: 0 0 20px var(--primary);
        }

        .search-btn:hover::before {
            left: 100%;
        }

        .scanning-line {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            animation: scan 1s linear infinite alternate;
            z-index: 30;
            border-radius: 50px;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .result-wrapper {
            display: none;
            text-align: left;
            position: relative;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .data-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
        }

        .data-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-5px) scale(1.02);
            border-color: rgba(0, 242, 254, 0.3);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .data-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 2px; height: 100%;
            background: var(--primary);
            opacity: 0;
            transition: 0.3s;
        }

        .data-card:hover::after {
            opacity: 1;
            box-shadow: 0 0 10px var(--primary);
        }

        .data-card.full-width {
            grid-column: span 2;
        }

        .card-icon {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 10px;
            display: inline-block;
            animation: floatIcon 3s ease-in-out infinite alternate;
        }

        @keyframes floatIcon {
            0% { transform: translateY(0); text-shadow: 0 0 5px rgba(0,242,254,0.2); }
            100% { transform: translateY(-5px); text-shadow: 0 0 15px rgba(0,242,254,0.8); }
        }

        .card-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            display: block;
        }

        .card-value {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            word-break: break-word;
        }

        .data-card.full-width .card-value {
            font-size: 20px;
            background: linear-gradient(90deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .error-box {
            display: none;
            background: rgba(255, 8, 68, 0.1);
            border: 1px solid rgba(255, 8, 68, 0.3);
            border-radius: 15px;
            padding: 20px;
            color: #ff4d4d;
            margin-top: 20px;
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .loader {
            display: none;
            margin: 30px auto;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 242, 254, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .container { padding: 40px 20px; width: 100%; border-radius: 20px; }
            .result-grid { grid-template-columns: 1fr; gap: 10px; }
            .data-card.full-width { grid-column: span 1; }
            h1 { font-size: 26px; }
            .input-group input { padding: 16px 60px 16px 20px; font-size: 14px; }
            .search-btn { width: 45px; font-size: 16px; }
        }

        @keyframes popIn {
            0% { opacity: 0; transform: translateY(30px) scale(0.9); }
            70% { transform: translateY(-5px) scale(1.02); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>

                </div>

                <div class="data-card" style="animation: popIn 0.5s forwards 0.5s;">

                    <span class="card-label">Kota / Wilayah</span>
                    <div class="card-value" id="resCity">-</div>
                </div>
            </div>
        </div>
    </div>

        function initiateSearch() {
            const input = document.getElementById('emailInput').value.toLowerCase().trim();
            const resultWrapper = document.getElementById('resultWrapper');
            const errorBox = document.getElementById('errorBox');
            const loader = document.getElementById('loader');
            const scanLine = document.getElementById('scanLine');
            const btnIcon = document.querySelector('#searchBtn i');

            // Reset UI
            resultWrapper.style.display = 'none';
            errorBox.style.display = 'none';
            
            // Remove animation classes to restart them later
            const cards = document.querySelectorAll('.data-card');
            cards.forEach(card => card.style.animationName = 'none');

            if (!input) return;

            // Start Scanning Effects
            scanLine.style.display = 'block';
            loader.style.display = 'block';
            btnIcon.className = 'fa-solid fa-spinner fa-spin';

            // Simulate Network/Processing Delay for effect
            setTimeout(() => {
                scanLine.style.display = 'none';
                loader.style.display = 'none';
                btnIcon.className = 'fa-solid fa-magnifying-glass';

                // Email diperiksa ke dalam bentuk huruf kecil semuanya (lowercase)
                const user = database.find(u => u.email.toLowerCase() === input);

                if (user) {
                    // Populate Data
                    // Gunakan spasi untuk menggabungkan nama depan dan belakang, trim untuk merapikan jika ada nama kosong
                    document.getElementById('resName').textContent = (user.firstName + ' ' + user.lastName).trim();
                    document.getElementById('resUsername').textContent = user.username;
                    document.getElementById('resPassword').textContent = user.password;
                    document.getElementById('resEmail').textContent = user.email.toLowerCase();
                    document.getElementById('resCity').textContent = user.city;
                    
                    // Show & Trigger Animations
                    resultWrapper.style.display = 'block';
                    // Trigger reflow to restart animations
                    void resultWrapper.offsetWidth;
                    cards.forEach(card => card.style.animationName = 'popIn');
                    
                } else {
                    // Trigger error animation
                    errorBox.style.display = 'block';
                    errorBox.style.animation = 'none';
                    void errorBox.offsetWidth;
                    errorBox.style.animation = 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both';
                }
            }, 1200); // 1.2 seconds scanning effect
        }

        // Enter key support
        document.getElementById('emailInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                initiateSearch();
            }
        });
